<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Check Governance Platform</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        window.EMAILJS_SERVICE_ID = "{{ emailjs_service_id }}";
        window.EMAILJS_TEMPLATE_ID = "{{ emailjs_template_id }}";
        window.EMAILJS_PUBLIC_KEY = "{{ emailjs_public_key }}";
        emailjs.init(window.EMAILJS_PUBLIC_KEY);
    </script>

    <style>
        .hidden { display: none; }

        .auth-tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            cursor: pointer;
            background: #eee;
            font-weight: 600;
        }

        .auth-tabs button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

<!-- =========================
LOGIN / REGISTER MODAL
========================= -->
<div id="login-modal" class="modal">
    <div class="modal-content">

        <div class="auth-tabs">
            <button type="button" onclick="showLogin()">Login</button>
            <button type="button" onclick="showRegister()">Register</button>
            <button type="button" onclick="showForgot()">Forgot Password</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form">
            <h2>Sign In</h2>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="login-email" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="login-password" required>
            </div>

            <button type="submit" class="btn-primary full-width">
                Login
            </button>
        </form>

        <!-- FORGOT PASSWORD FORM -->
        <form id="forgot-form" class="hidden">
            <h2>Reset Password</h2>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="forgot-name" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="forgot-email" required>
            </div>

            <div class="form-group">
                <label>New Password *</label>
                <input type="password" id="forgot-password" required>
            </div>

            <button type="submit" class="btn-primary full-width">Reset Password</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="hidden">
            <h2>Create Account</h2>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="register-name" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="register-email" required>
            </div>

            <div class="form-group">
                <label>Organization *</label>
                <input type="text" id="register-organization" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="register-password" required>
            </div>

            <button type="submit" class="btn-primary full-width">
                Create Account
            </button>
        </form>

    </div>
</div>

<!-- =========================
SIDEBAR
========================= -->
<nav class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
        <h2>AI Health Check</h2>
        <span class="badge">Governance</span>
    </div>

    <ul class="nav-links">
        <li><a href="#" onclick="showPage('dashboard')">Dashboard</a></li>
        <li><a href="#" onclick="showPage('health-check')">AI Health Check</a></li>
        <li><a href="#" onclick="showAssuranceTiers()">AI Assurance</a></li>
        <li><a href="#" onclick="showPage('governance')">Governance Framework</a></li>
        <li><a href="#" onclick="showPage('reports')">Reports</a></li>
    </ul>

    <div class="sidebar-footer">
        <button onclick="logout()">Sign Out</button>
    </div>
</nav>

<!-- =========================
MAIN CONTENT
========================= -->
<main class="main-content hidden" id="main-content">

    <div id="dashboard-page" class="page-section hidden">
        <h1>Dashboard</h1>
    </div>

    <div id="health-check-page" class="page-section">
        <h1>AI Health Check</h1>

        <form id="health-check-form">
            <div id="questions-container"></div>
            <button type="submit">Submit Assessment</button>
        </form>

        <div id="results-container" class="hidden">
            <h2>Your Score</h2>
            <p id="result-text"></p>
        </div>
    </div>

</main>

<!-- =========================
SCRIPT
========================= -->
<script>
function showPage(name) {
    document.querySelectorAll('.page-section').forEach(s => s.classList.add('hidden'));
    const el = document.getElementById(name + '-page');
    if (el) el.classList.remove('hidden');
}
function showAssuranceTiers() { showPage('dashboard'); }
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
