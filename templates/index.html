<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Health Check Governance Platform</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        window.EMAILJS_SERVICE_ID = "{{ emailjs_service_id }}";
        window.EMAILJS_TEMPLATE_ID = "{{ emailjs_template_id }}";
        window.EMAILJS_PUBLIC_KEY = "{{ emailjs_public_key }}";
        emailjs.init(window.EMAILJS_PUBLIC_KEY);
    </script>

    <style>
        .hidden { display: none; }

        .auth-tabs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .auth-tabs button {
            flex: 1;
            padding: 10px;
            border: none;
            cursor: pointer;
            background: #eee;
            font-weight: 600;
        }

        .auth-tabs button:hover {
            background: #ddd;
        }
    </style>
</head>

<body>

<!-- =========================
LOGIN / REGISTER MODAL
========================= -->
<div id="login-modal" class="modal">
    <div class="modal-content">

        <div class="auth-tabs">
            <button type="button" onclick="showLogin()">Login</button>
            <button type="button" onclick="showRegister()">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form">
            <h2>Sign In</h2>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="login-email" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="login-password" required>
            </div>

            <button type="submit" class="btn-primary full-width">
                Login
            </button>
        </form>

        <!-- REGISTER FORM -->
        <form id="register-form" class="hidden">
            <h2>Create Account</h2>

            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="register-name" required>
            </div>

            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="register-email" required>
            </div>

            <div class="form-group">
                <label>Organization *</label>
                <input type="text" id="register-organization" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="register-password" required>
            </div>

            <button type="submit" class="btn-primary full-width">
                Create Account
            </button>
        </form>

    </div>
</div>

<!-- =========================
SIDEBAR
========================= -->
<nav class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
        <h2>AI Health Check</h2>
        <span class="badge">Governance</span>
    </div>

    <ul class="nav-links">
        <li><a href="#" onclick="showPage('dashboard')">Dashboard</a></li>
        <li><a href="#" onclick="showPage('health-check')">AI Health Check</a></li>
        <li><a href="#" onclick="showAssuranceTiers()">AI Assurance</a></li>
        <li><a href="#" onclick="showPage('governance')">Governance Framework</a></li>
        <li><a href="#" onclick="showPage('reports')">Reports</a></li>
    </ul>

    <div class="sidebar-footer">
        <button onclick="logout()">Sign Out</button>
    </div>
</nav>

<!-- =========================
MAIN CONTENT
========================= -->
<main class="main-content hidden" id="main-content">

    <div id="dashboard-page" class="page-section hidden">
        <h1>Dashboard</h1>
    </div>

    <div id="health-check-page" class="page-section">
        <h1>AI Health Check</h1>

        <form id="health-check-form">
            <div id="questions-container"></div>
            <button type="submit">Submit Assessment</button>
        </form>

        <div id="results-container" class="hidden">
            <h2>Your Score</h2>
            <p id="result-text"></p>
        </div>
    </div>

</main>

<!-- =========================
SCRIPT
========================= -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

<script>
// =========================
// TOGGLE LOGIN / REGISTER
// =========================
function showLogin() {
    document.getElementById("login-form").classList.remove("hidden");
    document.getElementById("register-form").classList.add("hidden");
}

function showRegister() {
    document.getElementById("register-form").classList.remove("hidden");
    document.getElementById("login-form").classList.add("hidden");
}

// =========================
// REGISTER
// =========================
document.getElementById("register-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            name: document.getElementById("register-name").value,
            email: document.getElementById("register-email").value,
            organization: document.getElementById("register-organization").value,
            password: document.getElementById("register-password").value
        })
    });

    const data = await res.json();

    if (data.success) {
        alert("Account created successfully!");
        showLogin();
    } else {
        alert(data.error);
    }
});

// =========================
// LOGIN
// =========================
document.getElementById("login-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value
        })
    });

    const data = await res.json();

    if (data.success) {
        document.getElementById("login-modal").style.display = "none";
        document.getElementById("sidebar").classList.remove("hidden");
        document.getElementById("main-content").classList.remove("hidden");
    } else {
        alert(data.error);
    }
});

// =========================
// LOGOUT
// =========================
async function logout() {
    await fetch("/logout", { method: "POST" });
    location.reload();
}
</script>

</body>
</html>
